button></div></div></div><div class="group" data-v-0dc9f3fa><div class="item social-links" data-v-0dc9f3fa><div class="vp-social-links social-links-list" data-v-0dc9f3fa data-v-e2958a1f><!--[--><a class="vp-social-link no-icon" href="https://github.com/yJader/JinBlog" aria-label="github" target="_blank" rel="noopener" data-v-e2958a1f data-v-208d2f23><span class="vpi-social-github" /></a><!--]--></div></div></div><!--]--><!--]--></div></div></div><!--[--><!--]--><button type="button" class="vp-navbar-hamburger hamburger" aria-label="mobile navigation" aria-expanded="false" aria-controls="nav-screen" data-v-c6b88ee9 data-v-355ec361><span class="container" data-v-355ec361><span class="top" data-v-355ec361></span><span class="middle" data-v-355ec361></span><span class="bottom" data-v-355ec361></span></span></button></div></div></div></div><div class="divider" data-v-c6b88ee9><div class="divider-line" data-v-c6b88ee9></div></div></div><!----></header><!----><!----><!--[--><div id="VPContent" vp-content class="vp-content" data-v-0fa49ad7 data-v-9dd78df7><div class="vp-posts" vp-posts data-v-9dd78df7 data-v-9172fa9d><!--[--><!--]--><div class="posts-container" data-v-9172fa9d><!----><div class="vp-post-list" data-v-9172fa9d data-v-71a5337f><!--[--><!--]--><!--[--><template><div class="vp-post-item" data-allow-mismatch data-v-71a5337f data-v-9ad7c285><!----><div class="post-item-content" data-v-9ad7c285><h3 data-v-9ad7c285><!----><!----><!----><a class="vp-link link" href="/JinBlog/blog/shmem-diag/" data-v-9ad7c285><!--[-->Ubuntu 24 内存异常排查：定位到 GDM 图形会话<!--]--></a></h3><div class="post-meta" data-v-9ad7c285><div class="category-list" data-v-9ad7c285><span class="icon vpi-folder" data-v-9ad7c285></span><!--[--><!--[--><a class="vp-link link no-icon" href="/JinBlog/blog/posts/categories/?id=1d75c0" data-v-9ad7c285><!--[-->踩坑记录<!--]--></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-9ad7c285><span class="icon vpi-clock" data-v-9ad7c285></span><span data-v-9ad7c285>2026-10-04</span></div></div><div class="vp-doc excerpt" data-v-9ad7c285><p>之前，201server 的内存膨胀到整台机器完全卡死，只能物理重启。随后将内存从 16G 升级到了 32G(<s>成本颇高</s>)，也为可能的高负载容器加上了资源限制和监控。</p>
<p>但大约半个月之后，宿主机的 Shmem 又涨到了约 18.6GiB，16GiB swap 几乎用满。</p>
<p>这次沿着历史采样数据重新排查，主要占用最终定位到 GDM 的登录界面会话。进一步验证发现，核显运行时自动省电触发了反复的连接检测和显示视图重建，而 Mutter 的 <code v-pre>detached_onscreens</code> 列表保留了旧图形对象的最后一个引用，导致内存不断积累。下面记录这次排查的过程。</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-71a5337f data-v-9ad7c285><!----><div class="post-item-content" data-v-9ad7c285><h3 data-v-9ad7c285><!----><!----><!----><a class="vp-link link" href="/JinBlog/blog/claude-code-opus-5-5-cache-analysis/" data-v-9ad7c285><!--[-->Claude Code 缓存异常排查：Kiro 渠道 &amp; Sub2API 分析<!--]--></a></h3><div class="post-meta" data-v-9ad7c285><div class="category-list" data-v-9ad7c285><span class="icon vpi-folder" data-v-9ad7c285></span><!--[--><!--[--><a class="vp-link link no-icon" href="/JinBlog/blog/posts/categories/?id=744605" data-v-9ad7c285><!--[-->Agent<!--]--></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-9ad7c285><span class="icon vpi-clock" data-v-9ad7c285></span><span data-v-9ad7c285>2026-10-04</span></div></div><div class="vp-doc excerpt" data-v-9ad7c285>
<p><strong>核心发现</strong>：</p>
<ol>
<li><strong>Kiro 渠道存在架构问题</strong>：系统上下文（~4.5k tokens）被注入到每轮 <code v-pre>messages</code> 而非 <code v-pre>system</code> 字段，导致对话历史异常膨胀</li>
<li><strong>Sub2API 无问题</strong>：抓包验证 Sub2API 完整保留了请求的缓存结构</li>
<li><strong>早期缓存重建问题已解决</strong>：9月30日测试出现 60K 异常缓存重建，10月3日复测已无法复现，可能是版本更新或后端策略调整所致</li>
</ol>
<p><strong>结论</strong>: 别用 kiro</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-71a5337f data-v-9ad7c285><!----><div class="post-item-content" data-v-9ad7c285><h3 data-v-9ad7c285><!----><!----><!----><a class="vp-link link" href="/JinBlog/blog/posts/xe7h3rou/" data-v-9ad7c285><!--[-->Powershell启动慢解决<!--]--></a></h3><div class="post-meta" data-v-9ad7c285><div class="category-list" data-v-9ad7c285><span class="icon vpi-folder" data-v-9ad7c285></span><!--[--><!--[--><a class="vp-link link no-icon" href="/JinBlog/blog/posts/categories/?id=1d75c0" data-v-9ad7c285><!--[-->踩坑记录<!--]--></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-9ad7c285><span class="icon vpi-clock" data-v-9ad7c285></span><span data-v-9ad7c285>2025-12-05</span></div></div><div class="vp-doc excerpt" data-v-9ad7c285><p>从不知道什么时候开始, PowerShell启动速度从秒开-&gt;2s-&gt;30s???, 实在忍不了了, 该解决了</p>
<div class="language-powershell line-numbers-mode" data-highlighter="shiki" data-ext="powershell" style="--shiki-light:#393a34;--shiki-dark:#dbd7caee;--shiki-light-bg:#ffffff;--shiki-dark-bg:#121212"><pre class="shiki shiki-themes vitesse-light vitesse-dark vp-code" v-pre=""><code class="language-powershell"><span class="line"><span style="--shiki-light:#393A34;--shiki-dark:#DBD7CAEE">PowerShell </span><span style="--shiki-light:#2F798A;--shiki-dark:#4C9A91">7.5</span><span style="--shiki-light:#393A34;--shiki-dark:#DBD7CAEE">.</span><span style="--shiki-light:#2F798A;--shiki-dark:#4C9A91">3</span></span>
<span class="line"><span style="--shiki-light:#393A34;--shiki-dark:#DBD7CAEE">Loading personal and system profiles took 30669ms.</span></span></code></pre>
<div class="line-numbers" aria-hidden="true" style="counter-reset:line-number 0"><div class="line-number"></div><div class="line-number"></div></div></div></div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-71a5337f data-v-9ad7c285><!----><div class="post-item-content" data-v-9ad7c285><h3 data-v-9ad7c285><!----><!----><!----><a class="vp-link link" href="/JinBlog/blog/g70sczk7/" data-v-9ad7c285><!--[-->Plain Text is All You Need (for Presentations)<!--]--></a></h3><div class="post-meta" data-v-9ad7c285><div class="category-list" data-v-9ad7c285><span class="icon vpi-folder" data-v-9ad7c285></span><!--[--><!--[--><a class="vp-link link no-icon" href="/JinBlog/blog/posts/categories/?id=28726c" data-v-9ad7c285><!--[-->杂项<!--]--></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-9ad7c285><span class="icon vpi-clock" data-v-9ad7c285></span><span data-v-9ad7c285>2025-06-09</span></div></div><div class="vp-doc excerpt" data-v-9ad7c285><!-- markdownlint-disable MD033 -->

<p>面对课程汇报 / 学术报告 / 组会等场景, 使用演示文稿进行Presentation是常见的方式</p>
<p>但是使用PowerPoint / Keynote等软件制作的演示文稿, 往往会有以下问题:</p>
<ul>
<li>操作复杂, 需要学习软件的使用 (虽然大家信息课都学习过)</li>
<li>跨平台兼容差 (经常要导出为pdf)</li>
<li>富文本文稿, 不利于版本控制&amp;同步</li>
<li><strong>LLM支持不够好</strong></li>
</ul>
<p>此时使用纯文本(Plain Text)来制作是一个不错的选择</p>
</div></div></div></template><template><div class="vp-post-item" data-allow-mismatch data-v-71a5337f data-v-9ad7c285><!----><div class="post-item-content" data-v-9ad7c285><h3 data-v-9ad7c285><!----><!----><!----><a class="vp-link link" href="/JinBlog/blog/eaq3vgce/" data-v-9ad7c285><!--[-->mkdocs踩坑记录<!--]--></a></h3><div class="post-meta" data-v-9ad7c285><div class="category-list" data-v-9ad7c285><span class="icon vpi-folder" data-v-9ad7c285></span><!--[--><!--[--><a class="vp-link link no-icon" href="/JinBlog/blog/posts/categories/?id=1d75c0" data-v-9ad7c285><!--[-->踩坑记录<!--]--></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-9ad7c285><span class="icon vpi-clock" data-v-9ad7c285></span><span data-v-9ad7c285>2024-06-30</span></div></div><div class="vp-doc excerpt" data-v-9ad7c285>
